<div style="background:#f2f2f2;padding:40px 0;">
  <div style="max-width:600px;background:#fff;border:1px solid #EEEEEE;border-radius:8px;margin:0 auto;">
    <img src="{{ url_base }}{{ media_url }}{{ logo_path }}" height="24" alt="" style="display:block;margin:24px 0 16px 32px;" />
    <div style="margin:0 32px;padding:48px 0 64px;border-top:1px solid #EEEEEE;min-height:300px;">
      <div style="color:#434144;font-size:14px;line-height:1.6;">
        {{ welcome_email_content|linebreaksbr }}
      </div>
      <p style="margin:24px 0 0;">
        <a href="{{ invitation_link }}" target="_blank" style="display:inline-block;padding:10px 18px;border-radius:4px;background-color:#f2812f;color:#fff;font-size:14px;text-decoration:none;">
          Log in
        </a>
      </p>
    </div>
  </div>
</div>
